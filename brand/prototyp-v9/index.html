  if (!FACT[ds.ct][ds.term]) ds.term = "36";
  var cur = unitRate(f, ds.size, ds.tier, ds.ct, ds.term);
  var size = pick(f.sizes, ds.size), tier = pick(f.tiers, ds.tier), col = pick(f.colors, ds.color);

  /* Groesse */
  cfg.querySelectorAll('[data-opt="size"]').forEach(function(el){
    var on = el.dataset.val === ds.size;
    el.classList.toggle("on", on);
    var dd = el.querySelector(".d");
    if (dd) dd.textContent = on ? "gewählt" : dfmt(unitRate(f, el.dataset.val, ds.tier, ds.ct, ds.term) - cur);
  });
  syncInk(cfg.querySelector('[data-rail="size"]'));
  /* Farbe */
  cfg.querySelectorAll('[data-opt="color"]').forEach(function(el){ el.classList.toggle("on", el.dataset.val === ds.color); });
  var stg = cfg.querySelector("[data-stage]");
  if (stg) stg.style.setProperty("--devc", col.hex);
  var simg = cfg.querySelector("[data-stageimg]");
  if (simg && simg.dataset.col !== col.id) {
    simg.dataset.col = col.id;
    simg.innerHTML = col.msku ? pimg(col.msku, "front-open", SZ.stage, f.name + ", " + col.label, true) : mock();
  }
  /* Leistung: je Stufe Name, Delta zur aktuellen Auswahl, Mehrwert-Satz, Spezifikation als Nebenzeile */
  var tlist = cfg.querySelector("[data-tierlist]");
  if (tlist) {
    var hasBelieb = f.tiers.some(function(t){ return t.id === KUR.beliebte_stufe; });
    tlist.innerHTML = f.tiers.map(function(t){
      var on = t.id === ds.tier;
      var dd2 = r10(unitRate(f, ds.size, t.id, ds.ct, ds.term) - cur);
      var pop = hasBelieb ? t.id === KUR.beliebte_stufe : !!t.pop;
      var mw = ((KUR.mehrwert || {})[f.reihe] || {})[t.id];
      return '<button class="tierrow' + (on ? " on" : "") + '" data-opt="tier" data-val="' + t.id + '" role="radio" aria-checked="' + on + '">' +
        '<span class="chk">' + icoCheck + '</span>' +
        '<span class="shelf-tx" style="min-width:0"><b>' + t.label + (pop ? '<span class="bst-etikett">Beliebt</span>' : '') + '</b>' +
        '<span style="display:block;margin-top:2px">' + (mw || t.rec) + '</span>' +
        '<span class="micro" style="display:block;margin-top:3px">' + t.spec + '</span></span>' +
        '<span class="shelf-rate num">' + (on ? "gewählt" : bfmt(dd2)) + '</span></button>';
    }).join("");
  }
  /* Vertragsart */
  cfg.querySelectorAll('[data-opt="ct"]').forEach(function(el){ el.classList.toggle("on", el.dataset.val === ds.ct); });
  syncPill(cfg.querySelector("[data-toggle]"));
  /* Laufzeit */
  var host = cfg.querySelector("[data-termtrack]");
  var items = TERMS[ds.ct].map(function(t){ return { id: t, label: t }; });
  if (host && host.dataset.ct !== ds.ct) {
    host.innerHTML = trackHTML(items, ds.term, "term", false);
    host.dataset.ct = ds.ct;
  }
  setTrack(cfg, "term", items, ds.term);
  var sv = cfg.querySelector("[data-saving]");
  if (sv) {
    var longest = TERMS[ds.ct][TERMS[ds.ct].length - 1], shortest = TERMS[ds.ct][0];
    var save = r10(cur - unitRate(f, ds.size, ds.tier, ds.ct, longest));
    var vsShort = r10(unitRate(f, ds.size, ds.tier, ds.ct, shortest) - cur);
    sv.textContent = save > 0
      ? "Bei " + longest + " Monaten zahlen Sie " + fmt(save) + " € weniger im Monat."
      : "Längste Laufzeit, " + fmt(vsShort) + " € günstiger als bei " + shortest + " Monaten.";
  }
  /* Menge */
  var q = Math.max(1, parseInt(ds.qty, 10) || 1);
  var qv = cfg.querySelector(".qv"); if (qv) qv.textContent = q;
  /* Zubehoer */
  var chosen = ds.addons ? ds.addons.split(",") : [], asum = 0;
  cfg.querySelectorAll("[data-ad]").forEach(function(row){
    var on = chosen.indexOf(row.dataset.ad) >= 0;
    row.classList.toggle("on", on);
    if (on) b.addons.forEach(function(a){ if (a.id === row.dataset.ad) asum += a.rate; });
  });
  asum = r10(asum);
  /* Anzeigen */
  var per = r10(cur + asum), total = Math.round(per * q * 100) / 100;
  var set = function(sel, txt){ var el = cfg.closest(".screen").querySelector(sel); if (el) el.textContent = txt; };
  set("[data-brk-dev]", "Gerät " + fmt(cur) + " €" + (q > 1 ? " × " + q : ""));
  var addEl = cfg.closest(".screen").querySelector("[data-brk-add]");
  if (addEl) addEl.textContent = asum ? "Zubehör " + fmt(asum) + " €" + (q > 1 ? " × " + q : "") : "";
  set("[data-brk-gross]", fmt(total * 1.19) + " € brutto");
  set("[data-now=size]", size.label);
  set("[data-now=color]", col.label);
  set("[data-now=tier]", tier.label);
  set("[data-now=term]", CTLBL[ds.ct] + ", " + ds.term + " Monate");
  set("[data-now=qty]", q + (q === 1 ? " Gerät" : " Geräte"));
  set("[data-cap-size]", size.label);
  set("[data-cap-color]", col.label);
  set("[data-cap-tier]", tier.label + ", " + tier.spec);
  cfg.dataset.unit = per;
  cfg.dataset.spec = size.label + ", " + tier.label + ", " + CTLBL[ds.ct] + ", " + ds.term + " Monate";
  /* Amazon-Moment: nur bei echtem Bestand gleicher Reihe und Groessenklasse, Ink ohne Akzent */
  var amz = cfg.querySelector("[data-amz]"), amzIn = cfg.querySelector("[data-amz-in]");
  if (amz && amzIn) {
    var mt2 = refMatch(b, f, ds.size);
    if (mt2) {
      amzIn.innerHTML = 'Auch refurbished ab <b style="color:var(--sf-ink)">' + fmt(mt2.rate) + ' €</b> im Monat, sofort verfügbar' +
        '<span class="demo">Demo</span>' +
        '<button class="lnk-ink" data-rt="' + mt2.id + '" style="margin-left:2px">Ansehen ' + icoArr + '</button>';
      amz.classList.remove("off");
    } else {
      amz.classList.add("off");
      setTimeout(function(){ if (amz.classList.contains("off")) amzIn.innerHTML = ""; }, 280);
    }
  }
  pushRate(cfg.closest(".screen"), total, flash);
}
function recomputeRef(rc, flash){ return rc; }

/* ---------- Alternativen-Moment, spaeter Check der Neugeraete-Anfrage ---------- */
function altDlg(b){
  if (!state.alt) return "";
  var cart = getCart(b.key);
  var it = cart.items[0] || { fam: b.fams[1].id, rate: abFrom(b.fams[1]) };
  var f = null; b.fams.forEach(function(x){ if (x.id === it.fam) f = x; });
  if (!f) f = b.fams[1];
  var alts = [];
  var oc = f.colors[1] || f.colors[0];
  alts.push({ t: "Gleiche Ausstattung, Farbe " + oc.label, s: "sofort planbar", d: 0 });
  var t0 = pick(f.tiers, f.def.tier), t1 = null;
  f.tiers.forEach(function(x){ if (x.d > t0.d && (!t1 || x.d < t1.d)) t1 = x; });
  if (t1) alts.push({ t: t1.spec + " statt " + t0.spec, s: t1.label, d: r10(t1.d - t0.d) });
  var s0 = pick(f.sizes, f.def.size), s1 = null;
  f.sizes.forEach(function(x){ if (x.d > s0.d && (!s1 || x.d < s1.d)) s1 = x; });
  if (s1) alts.push({ t: s1.label + " statt " + s0.label, s: s1.sub, d: r10(s1.d - s0.d) });
  var rows = alts.slice(0, 3).map(function(a, i){
    return '<button class="alt" data-rev style="--d:' + (i * 60) + 'ms" data-altok>' +
      '<span class="alt-tx"><b>' + a.t + '</b><span>' + a.s + ' · ' + (a.d === 0 ? "gleiche Rate" : dfmt(a.d) + " mtl.") + '</span></span>' +
      '<span class="alt-take">Übernehmen</span></button>';
  }).join("");
  var mt = refMatch(b, f, f.def.size);
  var refBlock = mt
    ? '<div class="altref" data-rev style="--d:220ms"><p class="lbl" style="margin-bottom:8px">Sofort verfügbar, refurbished</p>' +
      '<button class="alt" style="border-top:0;padding-top:6px" data-rt="' + mt.id + '">' +
        '<span class="alt-tx"><b>' + mt.name + ', Zustand ' + mt.zustand + '</b>' +
        '<span>ab ' + fmt(mt.rate) + ' € mtl.<span class="demo">Demo</span></span></span>' +
        '<span class="lnk-ink">Refurbished ansehen ' + icoArr + '</span></button></div>'
    : "";
  return '<div class="dlg" data-dlgpos><div class="dlg-in">' +
    '<h2 class="h2">Ihre Variante ist gerade nicht lieferbar</h2>' +
    '<p class="lead" style="margin:10px 0 18px">Diese Alternativen bestehen den Verfügbarkeits-Check.<span class="demo">Demo</span></p>' +
    rows + refBlock +
    '<div style="margin-top:24px"><button class="btn ghost block" data-altkeep>Bei meiner Auswahl bleiben</button>' +
    '<p class="micro" style="text-align:center;margin:10px 0 0">Die Anfrage geht mit einem Vermerk an uns.</p></div>' +
  '</div></div>';
}

/* ---------- Interaktion ---------- */
function nearestStop(trk, clientX){
  var inner = trk.querySelector(".trk-in").getBoundingClientRect();
  var stops = [].slice.call(trk.querySelectorAll(".stop"));
  var p = Math.max(0, Math.min(1, (clientX - inner.left) / inner.width));
  var idx = Math.round(p * (stops.length - 1));
  return stops[idx];
}
stage.addEventListener("pointerdown", function(e){
  var trk = e.target.closest(".trk"); if (!trk) return;
  var host = trk.closest(".cfg, .rcfg"); if (!host) return;
  var move = function(ev){
    var s = nearestStop(trk, ev.clientX);
    if (!s || s.classList.contains("on")) return;
    host.dataset[s.dataset.opt] = s.dataset.val;
    if (host.classList.contains("cfg")) recompute(host, false); else recomputeRef(host, false);
  };
  move(e);
  var up = function(){
    window.removeEventListener("pointermove", move);
    window.removeEventListener("pointerup", up);
    if (host.classList.contains("cfg")) recompute(host, true); else recomputeRef(host, true);
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
});
stage.addEventListener("click", function(e){
  var scr = e.target.closest(".screen"); if (!scr) return;
  var k = scr.dataset.sf, b = BRANDS[k];

  var tel = e.target.closest('a[href^="tel:"]'); if (tel) { e.preventDefault(); return; }

  /* Im Paket enthalten: Kachel oeffnet das Blatt, Schliessen kehrt an die Scrollposition zurueck */
  var zk = e.target.closest("[data-zub]");
  if (zk) { state.zub = zk.dataset.zub; state.zubImg = 0; state.zubKeep = true; render(); return; }
  var zd = e.target.closest("[data-zubdot]");
  if (zd) { state.zubImg = +zd.dataset.zubdot; state.zubKeep = true; render(); return; }
  var zc = e.target.closest("[data-zub-close]");
  if (zc && (zc.classList.contains("iconbtn") || !e.target.closest(".dlg-in"))) { state.zub = null; state.zubKeep = true; render(); return; }

  /* Ausstattung: Bausteine schalten, Menge, Komplett ausstatten, Summenleiste */
  var bt = e.target.closest("[data-bstoggle]");
  if (bt && !bt.disabled) {
    bstSelect(b, ausContext(b), bt.dataset.bstoggle, !state.bstSel[bt.dataset.bstoggle]);
    if (state.screen === "refkasse") { render(); } else { updateAus(true); }
    return;
  }
  var bq = e.target.closest("[data-bq]");
  if (bq) {
    var bqid = bq.dataset.bqid;
    if (state.bstSel[bqid]) { state.bstSel[bqid] = Math.max(1, state.bstSel[bqid] + parseInt(bq.dataset.bq, 10)); state.bstNotes = []; updateAus(true); }
    return;
  }
  if (e.target.closest("[data-komplett]")) { bstKomplett(b, ausContext(b)); updateAus(true); return; }
  var bx = e.target.closest("[data-bstexp]");
  if (bx) { state.bstOpen[bx.dataset.bstexp] = !state.bstOpen[bx.dataset.bstexp]; updateAus(false); return; }
  var brm = e.target.closest("[data-bst-rm]");
  if (brm) {
    bstSelect(b, ausContext(b), brm.dataset.bstRm, false);
    if (state.screen === "refkasse" || state.screen === "anfrage") { render(); } else { updateAus(true); }
    return;
  }
  if (e.target.closest("[data-stufewechsel]")) { state.screen = "konfigurator"; state.sheet = false; state.ausSheet = false; render(); return; }
  var ag = e.target.closest("[data-aus-go]");
  if (ag) {
    state.ausSheet = false;
    var ctxGo = ausContext(b);
    if (ctxGo.welt === "refurb") { state.cashMode = "abo"; state.kaStep = 1; state.conflict = false; state.screen = "refkasse"; render(); return; }
    var cartGo = getCart(k);
    cartGo.items.push({ name: ctxGo.name, spec: ctxGo.spec, rate: ctxGo.rate, qty: ctxGo.qty, fam: ctxGo.fam });
    bstSelRows(b, ctxGo).forEach(function(r){
      cartGo.items.push({ name: bstTitle(r.x, b), spec: "Baustein · " + KATL[r.x.kategorie], rate: r.x.delta_monat_netto, qty: r.qty });
    });
    saveCart(k, cartGo);
    state.sheet = true; state.aqStep = 1; state.screen = "anfrage"; render(); return;
  }
  if (e.target.closest("[data-ausbar]")) { state.ausSheet = true; render(); return; }
  var asc = e.target.closest("[data-aussheet-close]");
  if (asc && (asc.classList.contains("iconbtn") || !e.target.closest(".dlg-in"))) { state.ausSheet = false; render(); return; }

  /* Refurbished-Spur */
  var rt = e.target.closest("[data-rt]");
  if (rt) { state.rt = rt.dataset.rt; state.rqty = 1; state.radd = []; state.buy = false; state.zub = null;
    state.screen = "refprod"; state.sheet = false; state.alt = false; render(); return; }
  var rq = e.target.closest("[data-rq]");
  if (rq) {
    var tt = refType(b, state.rt), nn = stockOf(tt);
    state.rqty = Math.max(1, Math.min(nn, state.rqty + parseInt(rq.dataset.rq, 10)));
    render(); return;
  }
  var radd = e.target.closest("[data-radd]");
  if (radd) {
    var ix2 = state.radd.indexOf(radd.dataset.radd);
    if (ix2 >= 0) state.radd.splice(ix2, 1); else state.radd.push(radd.dataset.radd);
    render(); return;
  }
  if (e.target.closest("[data-buytoggle]")) { state.buy = !state.buy; render(); return; }
  var cash = e.target.closest("[data-cash]");
  if (cash) {
    state.cashMode = cash.dataset.cash; state.kaStep = 1; state.conflict = false;
    if (cash.dataset.cash === "abo") {
      state.rt = refType(b, state.rt).id; /* rt aufloesen, auch ohne vorherigen Katalog-Klick */
      var sigR = "refurb|" + state.rt;
      if (state.bstDevSig !== sigR) { state.bstSel = {}; state.bstNotes = []; state.bstDevSig = sigR; }
      state.ausWelt = "refurb"; state.ausSheet = false; state.screen = "ausstattung";
    } else {
      state.screen = "refkasse";
    }
    render(); return;
  }
  var kastep = e.target.closest("[data-kastep]");
  if (kastep) { state.kaStep = +kastep.dataset.kastep; render(); return; }
  var pay = e.target.closest("[data-pay]");
  if (pay) {
    var t3 = refType(b, state.rt), n3 = stockOf(t3);
    pay.classList.add("loading"); pay.textContent = "Wird an Stripe übergeben…";
    setTimeout(function(){
      /* spaeter Bestands-Check, erst hier wird reserviert */
      if (state.rqty > Math.max(0, n3 - 1)) { state.conflict = true; render(); return; }
      state.kaStep = state.stripeFail ? 5 : 4; render();
    }, 900);
    return;
  }
  var fix = e.target.closest("[data-fix]");
  if (fix) {
    var t4 = refType(b, state.rt), n4 = stockOf(t4);
    state.conflict = false;
    if (fix.dataset.fix === "qty") { state.rqty = Math.max(1, n4 - 1); state.kaStep = 1; }
    else if (fix.dataset.fix === "kat") { state.screen = "refkat"; }
    else { state.screen = "konfigurator"; }
    render(); return;
  }
  /* Use-Case-Kacheln und Rueckrichtung, jeweils mit Vorbelegung */
  var uc = e.target.closest("[data-uc]") || e.target.closest("[data-newfam]");
  if (uc) {
    var parts = (uc.dataset.uc || uc.dataset.newfam).split("|");
    b.fams.forEach(function(x, i){ if (x.id === parts[0]) state.fami = i; });
    state.presetSize = parts[1] || null;
    state.screen = "konfigurator"; state.sheet = false; render(); return;
  }
  /* Alternativen-Moment */
  if (e.target.closest("[data-altkeep]") || e.target.closest("[data-altok]")) {
    state.alt = false; state.altDone = true; state.aqStep = 2; render(); return;
  }

  var sh = e.target.closest("[data-sheet]");
  if (sh) { state.sheet = sh.dataset.sheet === "open"; if (state.sheet) state.aqStep = 1; state.screen = state.sheet ? "anfrage" : (state.screen === "anfrage" ? "konfigurator" : state.screen); render(); return; }

  var stp = e.target.closest("[data-step]");
  if (stp) {
    var want = +stp.dataset.step;
    if (want === 2 && !state.altDone) { state.alt = true; render(); return; }
    state.aqStep = want; render(); return;
  }

  var rm = e.target.closest("[data-rm]");
  if (rm) { var c = getCart(k); c.items.splice(+rm.dataset.rm, 1); saveCart(k, c); render(); return; }

  var lq = e.target.closest("[data-lq]");
  if (lq) {
    var line = lq.closest(".line"), i = +line.dataset.i, cc = getCart(k);
    cc.items[i].qty = Math.max(1, cc.items[i].qty + parseInt(lq.dataset.lq, 10));
    saveCart(k, cc);
    line.querySelector(".qv").textContent = cc.items[i].qty;
    line.querySelector(".lr").textContent = fmt(cc.items[i].rate * cc.items[i].qty) + " €";
    var t = cartTotal(k);
    scr.querySelectorAll(".cart-total").forEach(function(el){ el.textContent = fmt(t) + " €"; });
    var cnt = cartCount(k);
    scr.querySelectorAll(".count").forEach(function(el){ el.textContent = cnt || ""; el.style.display = cnt ? "" : "none"; });
    return;
  }
  var send = e.target.closest("[data-send]");
  if (send) {
    send.classList.add("loading"); send.textContent = "Wird gesendet…";
    setTimeout(function(){ state.lastOrder = getCart(k).items.slice(); CARTS[k] = { items: [] }; saveCart(k, CARTS[k]); state.aqStep = 3; render(); }, 900);
    return;
  }
  var take = e.target.closest("[data-take]");
  if (take) {
    var cfg = scr.querySelector(".cfg");
    if (cfg) {
      var f = b.fams[+cfg.dataset.fami], ds = cfg.dataset, q = Math.max(1, parseInt(ds.qty, 10) || 1);
      state.neuSel = { fam: f.id, fami: +ds.fami, reihe: f.reihe, name: f.name, tier: ds.tier, qty: q, term: ds.term,
        rate: unitRate(f, ds.size, ds.tier, ds.ct, ds.term), spec: ds.spec };
      var sigN = "neu|" + f.id;
      if (state.bstDevSig !== sigN) { state.bstSel = {}; state.bstNotes = []; state.bstDevSig = sigN; }
      state.ausWelt = "neu"; state.ausSheet = false; pruneBst(b);
    }
    state.screen = "ausstattung"; state.sheet = false; render();
    return;
  }
  var fam = e.target.closest("[data-fam]");
  if (fam) {
    b.fams.forEach(function(x, i){ if (x.id === fam.dataset.fam) state.fami = i; });
    state.screen = "konfigurator"; render(); return;
  }
  var fs = e.target.closest("[data-fami]");
  if (fs && fs.tagName === "BUTTON" && fs.closest(".famswitch")) { state.fami = +fs.dataset.fami; render(); return; }

  var dot = e.target.closest("[data-dot]");
  if (dot) {
    var leaf = scr.querySelector('[data-leaf="' + dot.dataset.dot + '"]');
    if (leaf) scr.scrollTo({ top: leaf.offsetTop - 60, behavior: REDUCE ? "auto" : "smooth" });
    return;
  }
  var opt = e.target.closest("[data-opt]");
  if (opt) {
    var host = opt.closest(".cfg, .rcfg");
    if (host) {
      host.dataset[opt.dataset.opt] = opt.dataset.val;
      if (host.classList.contains("cfg")) recompute(host, true); else recomputeRef(host, true);
      return;
    }
  }
  var ad = e.target.closest("[data-ad]");
  if (ad) {
    var h2 = ad.closest(".cfg");
    var s = h2.dataset.addons ? h2.dataset.addons.split(",") : [];
    var ix = s.indexOf(ad.dataset.ad);
    if (ix >= 0) s.splice(ix, 1); else s.push(ad.dataset.ad);
    h2.dataset.addons = s.filter(Boolean).join(",");
    recompute(h2, true); return;
  }
  var ru = e.target.closest("[data-ru]");
  if (ru && ru.tagName === "BUTTON") {
    var rc = ru.closest(".rcfg"); rc.dataset.ru = ru.dataset.ru; recomputeRef(rc, true); return;
  }
  var qb = e.target.closest("[data-q]");
  if (qb) {
    var h3 = qb.closest(".cfg, .rcfg");
    h3.dataset.qty = Math.max(1, (parseInt(h3.dataset.qty, 10) || 1) + parseInt(qb.dataset.q, 10));
    if (h3.classList.contains("cfg")) recompute(h3, true); else recomputeRef(h3, true);
    return;
  }
  var ai = e.target.closest(".acc-item");
  if (ai) {
    var wrapAcc = ai.closest(".acc"), idx = +ai.dataset.ai;
    wrapAcc.querySelectorAll(".acc-item").forEach(function(x){ x.classList.toggle("on", x === ai); });
    wrapAcc.querySelectorAll(".acc-layer").forEach(function(l, j){
      l.classList.toggle("on", j === idx);
      var v = l.querySelector("video");
      if (v) setPlay(v, j === idx);
    });
    return;
  }
  var vc = e.target.closest("[data-vctl]");
  if (vc) {
    var hv = vc.closest(".hero").querySelector("video");
    if (hv) {
      if (hv.paused) { delete hv.dataset.up; hv.play().catch(function(){}); vc.classList.remove("paused"); }
      else { hv.pause(); hv.dataset.up = "1"; vc.classList.add("paused"); }
    }
    return;
  }
  var go = e.target.closest("[data-go]");
  if (go) { state.screen = go.dataset.go; state.sheet = false; state.zub = null; render(); }
});
/* Tastatur auf den Reglern */
stage.addEventListener("keydown", function(e){
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  var s = e.target.closest(".stop"); if (!s) return;
  var trk = s.closest(".trk"), stops = [].slice.call(trk.querySelectorAll(".stop"));
  var i = stops.indexOf(s) + (e.key === "ArrowRight" ? 1 : -1);
  if (i < 0 || i >= stops.length) return;
  e.preventDefault();
  var host = trk.closest(".cfg, .rcfg");
  host.dataset[stops[i].dataset.opt] = stops[i].dataset.val;
  if (host.classList.contains("cfg")) recompute(host, true); else recomputeRef(host, true);
  var again = trk.querySelector(".stop.on"); if (again) again.focus();
});

/* Ziehbares Positionslisten-Blatt: folgt dem Finger, schliesst ab 30 % Zugweg oder
   schnellem Wisch, federt sonst mit Ueberschwinger zurueck. Scrim koppelt an den Zugweg. */
var shDrag = null;
stage.addEventListener("pointerdown", function(e){
  var grip = e.target.closest("[data-grip]"); if (!grip) return;
  var sh = grip.closest(".dlg-in"), dlg = sh.closest(".dlg");
  var tr = getComputedStyle(sh).transform, off = 0;
  if (tr && tr !== "none") { off = new DOMMatrixReadOnly(tr).m42 || 0; } /* Rueckfeder uebernehmen */
  shDrag = { sh: sh, dlg: dlg, y0: e.clientY, off: off, h: sh.offsetHeight, last: e.clientY, lt: performance.now(), v: 0 };
  sh.style.transition = "none"; sh.style.willChange = "transform"; sh.style.animation = "none";
  grip.setPointerCapture(e.pointerId);
  e.preventDefault();
});
stage.addEventListener("pointermove", function(e){
  if (!shDrag) return;
  var now = performance.now();
  shDrag.v = (e.clientY - shDrag.last) / Math.max(1, now - shDrag.lt);
  shDrag.last = e.clientY; shDrag.lt = now;
  var dy = Math.max(0, shDrag.off + e.clientY - shDrag.y0);
  shDrag.sh.style.transform = "translateY(" + dy + "px)";
  shDrag.dlg.style.background = "rgba(12,14,17," + (0.42 * Math.max(0, 1 - dy / shDrag.h)).toFixed(3) + ")";
});
function shDragEnd(e){
  if (!shDrag) return;
  var d = shDrag; shDrag = null;
  var dy = Math.max(0, d.off + e.clientY - d.y0);
  d.sh.style.willChange = "";
  if (dy > d.h * 0.3 || d.v > 0.6) {
    var isZub = d.dlg.classList.contains("zub");
    if (REDUCE) { if (isZub) { state.zub = null; state.zubKeep = true; } else state.ausSheet = false; render(); return; }
    d.sh.style.transition = "transform var(--sf-dur-2) var(--sf-ease)";
    d.sh.style.transform = "translateY(" + (d.h + 24) + "px)";
    d.dlg.style.background = "rgba(12,14,17,0)";
    setTimeout(function(){ if (!shDrag) { if (isZub) { state.zub = null; state.zubKeep = true; } else state.ausSheet = false; render(); } }, 260);
  } else {
    d.sh.style.transition = REDUCE ? "none" : "transform .45s cubic-bezier(.34,1.56,.64,1)";
    d.sh.style.transform = "translateY(0px)";
    d.dlg.style.background = "";
  }
}
stage.addEventListener("pointerup", shDragEnd);
stage.addEventListener("pointercancel", shDragEnd);
/* will-change nur waehrend der Bewegung (Anfrage-Blatt und Bottom Sheet) */
stage.addEventListener("transitionrun", function(e){
  if (e.propertyName === "transform" && e.target.classList && (e.target.classList.contains("sheet") || e.target.classList.contains("dlg-in"))) e.target.style.willChange = "transform";
}, true);
stage.addEventListener("transitionend", function(e){
  if (e.propertyName === "transform" && e.target.style) e.target.style.willChange = "";
}, true);

render();
</script>
</body>
</html>
